# CI/CD for the SMS Movies Next.js app on Azure App Service (Linux).
# Configure the required pipeline variables documented in README.md.
name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - main

# For Azure Repos Git, configure a required Build Validation branch policy instead.
# YAML PR triggers apply to GitHub and Bitbucket Cloud repositories.
pr:
  autoCancel: true
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  - name: nodeVersion
    value: '22.x'
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm
  - name: NEXT_TELEMETRY_DISABLED
    value: '1'
  - name: CI
    value: 'true'

stages:
  - stage: Validate
    displayName: Test and build
    jobs:
      - job: ValidateAndBuild
        displayName: Validate and build movie app
        timeoutInMinutes: 20
        steps:
          - checkout: self
            clean: true
            persistCredentials: false

          - task: UseNode@1
            displayName: Use Node.js $(nodeVersion)
            inputs:
              version: $(nodeVersion)

          - task: Cache@2
            displayName: Cache npm downloads
            inputs:
              key: 'npm | "$(Agent.OS)" | "$(nodeVersion)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)" | "$(nodeVersion)"
              path: $(npm_config_cache)

          - task: Cache@2
            displayName: Cache Next.js build output
            inputs:
              key: 'next | "$(Agent.OS)" | package-lock.json | **/*.ts | **/*.tsx | **/*.css'
              restoreKeys: |
                next | "$(Agent.OS)" | package-lock.json
                next | "$(Agent.OS)"
              path: $(Build.SourcesDirectory)/.next/cache

          # Always run npm ci, even on a cache hit; node_modules is not cached.
          - script: npm ci --prefer-offline --no-audit --no-fund
            displayName: Install locked dependencies

          - script: npm run lint -- --max-warnings=0
            displayName: Check ESLint

          - script: |
              set -euo pipefail
              npx --no-install next typegen
              npx --no-install tsc --noEmit
            displayName: Generate route types and check TypeScript

          - script: npm run test:coverage
            displayName: Run tests and enforce 80% coverage

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results/junit.xml
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: always()
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml

          # Use the bundler already verified for this project.
          - script: npm run build -- --webpack
            displayName: Build production application
            env:
              BACKEND_URL: $(productionBackendUrl)

          - task: CopyFiles@2
            displayName: Add public assets to standalone server
            inputs:
              SourceFolder: $(Build.SourcesDirectory)/public
              Contents: |
                **
              TargetFolder: $(Build.SourcesDirectory)/.next/standalone/public

          - task: CopyFiles@2
            displayName: Add static assets to standalone server
            inputs:
              SourceFolder: $(Build.SourcesDirectory)/.next/static
              Contents: |
                **
              TargetFolder: $(Build.SourcesDirectory)/.next/standalone/.next/static

          - task: ArchiveFiles@2
            displayName: Package standalone application
            inputs:
              rootFolderOrFile: $(Build.SourcesDirectory)/.next/standalone
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/movie-app.zip
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: Publish successful build
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/movie-app.zip
              artifact: movie-app
              publishLocation: pipeline

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployWebApp
        displayName: Deploy movie app
        steps:
          - download: current
            artifact: movie-app

          - bash: |
              set -euo pipefail
              required_values=("$AZURE_WEB_APP_NAME" "$AZURE_RESOURCE_GROUP" "$BACKEND_URL" "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" "$IP_HASH_SALT")
              for value in "${required_values[@]}"; do
                if [[ -z "$value" || "$value" == \$\(*\) ]]; then
                  echo "##vso[task.logissue type=error]A required pipeline variable is missing. See README.md."
                  exit 1
                fi
              done
              case "$BACKEND_URL" in
                https://localhost*|https://127.0.0.1*|https://\[::1\]*)
                  echo "##vso[task.logissue type=error]productionBackendUrl must not point to localhost."
                  exit 1
                  ;;
                https://*) ;;
                *)
                  echo "##vso[task.logissue type=error]productionBackendUrl must be an absolute HTTPS URL."
                  exit 1
                  ;;
              esac
              if [[ "$SUPABASE_URL" != https://*.supabase.co* ]]; then
                echo "##vso[task.logissue type=error]supabaseUrl must be an HTTPS Supabase project URL."
                exit 1
              fi
              if (( ${#IP_HASH_SALT} < 32 )); then
                echo "##vso[task.logissue type=error]ipHashSalt must contain at least 32 characters."
                exit 1
              fi
            displayName: Validate production configuration
            env:
              AZURE_WEB_APP_NAME: $(azureWebAppName)
              AZURE_RESOURCE_GROUP: $(azureResourceGroup)
              BACKEND_URL: $(productionBackendUrl)
              SUPABASE_URL: $(supabaseUrl)
              SUPABASE_SECRET_KEY: $(supabaseSecretKey)
              IP_HASH_SALT: $(ipHashSalt)

          - task: AzureAppServiceSettings@1
            displayName: Configure App Service runtime
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(azureWebAppName)
              resourceGroupName: $(azureResourceGroup)
              appSettings: |
                [
                  { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "false", "slotSetting": false },
                  { "name": "NEXT_TELEMETRY_DISABLED", "value": "1", "slotSetting": false },
                  { "name": "HOSTNAME", "value": "0.0.0.0", "slotSetting": false },
                  { "name": "BACKEND_URL", "value": "$(productionBackendUrl)", "slotSetting": false },
                  { "name": "SUPABASE_URL", "value": "$(supabaseUrl)", "slotSetting": false },
                  { "name": "SUPABASE_SECRET_KEY", "value": "$(supabaseSecretKey)", "slotSetting": false },
                  { "name": "IP_HASH_SALT", "value": "$(ipHashSalt)", "slotSetting": false }
                ]

          - task: AzureWebApp@1
            displayName: Deploy successful main build
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(azureWebAppName)
              package: $(Pipeline.Workspace)/movie-app/movie-app.zip
              runtimeStack: NODE|22-lts
              startUpCommand: node server.js
